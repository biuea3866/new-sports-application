# LB nginx config (⑦ 상시 트래픽 시뮬레이터 소유) — docker-compose.lb.yml의 nginx-lb가 마운트한다.
#
# 근거: TDD.md "nginx LB 설계"(FR-1). mcp.conf(MCP 전용 443 엔드포인트, ⑧/DevOps 소유)는 무수정 —
#       이 파일은 앱 전체(/) 앞에 서는 별도 인그레스다.
#
# 핵심: backend가 deploy.replicas:3으로 뜨면 Docker 임베디드 DNS(127.0.0.11)가 `backend`에 3개 IP를
#       반환한다. nginx가 `upstream { server backend:8080; }` 형태로 정적 upstream을 쓰면 시작 시점에
#       IP를 1회만 resolve해 캐시하므로 라운드로빈이 되지 않는다. 이를 피하기 위해:
#         1) `resolver 127.0.0.11 valid=10s`로 DNS TTL을 짧게 재해석
#         2) location 안에서 변수(`set $pool backend`)로 proxy_pass 대상을 만들어 매 요청마다 재해석
#       이 두 가지를 함께 써야 실제로 3 replica에 요청이 분산된다.
#
# mcp.conf는 정적 `upstream sports_backend { server ...; keepalive 64; }` 블록을 쓴다 — 이 파일은
# 그 이름 관례만 계승하고 실체는 만들지 않는다. 정적 upstream 블록은 nginx 시작·reload 시점에 호스트명을
# 1회 resolve하므로(라운드로빈 실패 원인이자, backend 컨테이너가 아직 없으면 nginx 자체가 기동 실패한다),
# `resolver` + location 내부 변수 proxy_pass만으로 매 요청 재해석한다. `keepalive`는 정적 upstream 블록
# 전용 기능이라 이 방식과는 함께 쓰지 않는다(정적 upstream을 다시 쓰면 IP가 캐시되어 라운드로빈이 깨진다).
# Docker 임베디드 DNS — `backend` 서비스명을 매 요청마다 재해석해 3 replica IP를 순환한다.
resolver 127.0.0.11 valid=10s;

# ══════════════════════════════════════════════════════════════════════════════
# [W1-08] 경로 → 서비스 매핑 (실행설계 §9-1 A단계)
#
# **이 표가 2단계 서비스 추출 전환 계획의 SSOT다.** 2단계는 "경로를 신규 서비스로 점진 전환"으로
# 진행되고, 그 전환 지점이 여기다. 1단계에서는 아래 두 번째 map 이 전부 `backend` 를 가리키므로
# **동작 변화가 0**이다 — 전환은 두 번째 map 의 대상 한 줄만 바꾸면 끝난다.
#
# 매핑 완전성은 `IngressRoutingMapTest` 가 컨트롤러의 @RequestMapping 을 실제로 스캔해 강제한다.
# 컨트롤러가 새로 생기면 그 테스트가 먼저 깨져 이 표의 갱신을 요구한다.
#
# nginx `map` 의 정규식 항목은 **선언 순서대로** 평가된다 — 더 구체적인 경로를 먼저 둔다.
# ══════════════════════════════════════════════════════════════════════════════
map $uri $sports_service {
    # 미매핑 경로는 여기로 떨어진다. 1단계에는 모두 backend 로 가므로 무해하지만,
    # 2단계에는 명시적 결정이 필요하다 — 새 경로를 이 표에 추가하지 않으면 unmapped 다.
    default unmapped;

    # ── social (더 구체적인 경로 우선) ─────────────────────────────────────────
    # 거래 채팅 개설은 social(message 컨텍스트) 소유다. 아래 /products(commerce) 보다 먼저 매칭돼야 한다.
    ~^/products/[^/]+/chat social;
    ~^/ws social;                    # STOMP 핸드셰이크 — 전용 location 이 업그레이드 헤더를 전달한다
    ~^/applications social;
    ~^/communities social;
    ~^/posts social;
    ~^/recruitments social;
    ~^/rooms social;

    # ── edge ──────────────────────────────────────────────────────────────────
    ~^/api/catalog edge;
    ~^/api/orders edge;
    ~^/images edge;
    ~^/virtual-queues edge;

    # ── commerce ──────────────────────────────────────────────────────────────
    ~^/api/event-host commerce;
    ~^/api/goods-seller commerce;
    ~^/cart commerce;
    ~^/events commerce;
    ~^/goods-orders commerce;
    ~^/limited-drops commerce;
    ~^/products commerce;
    ~^/ticket-orders commerce;

    # ── payment ───────────────────────────────────────────────────────────────
    # PG 웹훅(/payments/webhook)도 이 항목에 포함된다. 2단계 전환 시 이 경로가 유실되면
    # **결제 확정이 끊긴다**(돈은 받고 서비스 미제공) — 전환 순서상 가장 마지막에, 그리고
    # 구/신 양쪽이 동시에 수신 가능한 상태를 확인한 뒤 전환한다.
    ~^/payments payment;

    # ── facility-booking ──────────────────────────────────────────────────────
    ~^/admin/facilities facility-booking;
    ~^/api/facility-owner facility-booking;
    ~^/bookings facility-booking;
    ~^/facilities facility-booking;

    # ── platform ──────────────────────────────────────────────────────────────
    ~^/admin/feature-flags platform;
    ~^/admin/notifications platform;
    ~^/admin/users platform;
    ~^/air-quality platform;
    ~^/api/admin platform;
    ~^/api/mcp platform;
    ~^/api/operator platform;
    ~^/auth platform;
    ~^/feature-demo platform;
    ~^/mcp platform;                 # spring-ai MCP 서버 SSE(/mcp/sse, /mcp/message)
    ~^/notifications platform;
    ~^/operator platform;
    ~^/users platform;
    ~^/weather platform;
    ~^/actuator platform;            # 1단계엔 단일 앱 — 2단계엔 서비스별 자기 actuator 로 갈린다
}

# [W1-08] 서비스 → 업스트림 호스트. **1단계는 전부 모놀리스다 (동작 변화 0).**
# 2단계 전환: 대상 서비스 한 줄을 신규 컨테이너 호스트로 바꾸면 그 경로만 넘어간다.
# 나머지 줄은 그대로이므로 전환 격리성이 구조적으로 보장된다.
map $sports_service $sports_upstream {
    default backend;
    unmapped backend;
    edge backend;
    commerce backend;
    payment backend;
    facility-booking backend;
    social backend;
    platform backend;
}

server {
    listen 80;
    server_name _;

    # 컨테이너 healthcheck 전용 — 업스트림을 타지 않고 즉시 200 응답
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # W1-06b: 내부 전용 경로는 외부 인그레스에서 차단한다.
    # /internal/** 는 서비스 간 호출(edge → platform 신원 검증, 2단계 C10)과 규칙 엔진 진입점 전용이다.
    # `^~` 접두 매칭은 정규식 location 보다 우선하고 `location /` 보다 길어서, 선언 순서와 무관하게
    # 이 블록이 이긴다. 403 대신 404 로 응답해 경로 존재 자체를 드러내지 않는다.
    location ^~ /internal/ {
        access_log off;
        return 404;
    }

    # [W1-08] STOMP WebSocket 전용 — 업그레이드 헤더를 전달해야 핸드셰이크가 성립한다.
    # 일반 프록시 설정으로는 Upgrade/Connection 이 전달되지 않아 101 이 나오지 않는다.
    #
    # **주의(nginx 상속 함정)**: location 이 자기 `proxy_set_header` 를 하나라도 선언하면 상위
    # (server) 레벨의 `proxy_set_header` 를 **전혀 상속하지 않는다.** 그래서 아래 location / 과
    # 같은 헤더 목록(특히 내부 신원 헤더 제거)을 여기 그대로 다시 선언한다 — 하나라도 빠지면
    # WebSocket 경로가 스푸핑 방어 ①의 구멍이 된다. `IngressRoutingMapTest` 가 모든 프록시
    # location 에 제거 규칙이 있는지 검사한다.
    location /ws {
        proxy_pass http://$sports_upstream:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 핸드셰이크 후 유휴 연결이 15s(FIX-03 일반 경로 값)에 끊기면 실시간 채팅이 계속 재연결된다.
        # WebSocket 은 요청-응답 수명이 아니라 세션 수명이므로 이 경로만 읽기 타임아웃을 길게 둔다.
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Internal-Auth-Subject "";
        proxy_set_header X-Internal-Auth-Channel "";
        proxy_set_header X-Internal-Auth-Scopes "";
    }

    # 앱 전체를 프록시 — mcp.conf처럼 경로별 rate-limit/SSE 분기를 두지 않는다(LB는 전체 트래픽 앞단).
    location / {
        # [W1-08] 변수 proxy_pass — 매 요청마다 resolver로 대상 호스트를 재해석한다.
        # 대상은 위 두 map 이 정한다: $uri → $sports_service → $sports_upstream.
        # 1단계에는 모든 서비스가 backend 이므로 기존과 동일하게 3 replica 라운드로빈이 유지된다.
        proxy_pass http://$sports_upstream:8080;
        proxy_http_version 1.1;

        # 비정상 replica 우회 — 헬스체크로 걸러지지 않은 순간의 개별 요청 실패에 대한 안전망.
        # [code-review p3, 검토 후 유지] 풀 고갈 503도 http_503 재시도 대상이라 포화 상태에서는
        # 요청이 최대 3배로 다른 replica에 재분산돼 DB 압력이 커질 수 있다. 다만 구매(POST)를
        # 포함한 이 티켓의 쓰기 엔드포인트는 비멱등이라 nginx가 재시도하지 않고(POST는 기본적으로
        # proxy_next_upstream 재시도 대상에서 제외됨), 재시도되는 건 GET류 조회뿐이라 완료 판정
        # (오버셀·주문 정합)에는 영향이 없다. proxy_next_upstream_timeout 미설정 상태로 유지한다.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        # FIX-03: 백엔드 최대 요청 수명(HikariCP 풀 대기 5s, application.yml)보다 2배 이상
        # 여유를 둬 "백엔드가 먼저 실패 응답을 내고, LB는 그 응답을 전달한다" 순서를 보장한다.
        # 구 30s는 풀 대기 30s(구 기본값)와 사실상 같아 nginx가 먼저 포기해 클라이언트엔 5xx,
        # 서버는 계속 진행·커밋하는 응답 전달 경로 절단이 발생했다(F3, 실측 리포트 L64-69).
        #
        # [code-review p2] 이 15s는 "백엔드 최대 요청 수명 = 풀 대기(5s) + 재시도 예산(1.5s)"을
        # 전제로 한다. 재시도 예산 축소(maxAttempts 200→20 등)는 FIX-02
        # (PurchaseLimitedDropUseCase/LimitedDropDomainService) 소관이며, FIX-02가 먼저 머지돼
        # 재시도 지연 합계가 실제로 축소된 뒤에만 이 전제가 성립한다. FIX-02 선행 머지 필수.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # W1-06b §6-3: 내부 신원 헤더 스푸핑 방어 ① — 외부에서 들어온 값을 빈 값으로 덮는다.
        # 하위 서비스는 이 헤더만 신뢰하므로, 위조가 통과하면 임의 사용자·임의 스코프로 승격된다.
        # 방어 ②(애플리케이션 계층 InternalIdentityHeaderSanitizingFilter)가 별도로 존재한다 —
        # nginx 를 우회하는 경로(포트 직접 노출·다른 인그레스)가 있을 수 있어 ①만 믿지 않는다.
        # 헤더를 추가하면 InternalIdentityHeaders.ALL 과 이 목록을 함께 갱신해야 한다
        # (InternalIngressGuardTest 가 두 목록의 일치를 강제한다).
        proxy_set_header X-Internal-Auth-Subject "";
        proxy_set_header X-Internal-Auth-Channel "";
        proxy_set_header X-Internal-Auth-Scopes "";
    }
}
