services:
  # ---- Application ----
  # 호스트 포트 publish 없음 — dev/prod override(docker-compose.{dev,prod}.yml)가 부여한다.
  backend:
    image: sports-backend:${DOCKER_TAG:-local}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sports?serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MONGODB_URI: mongodb://mongodb:27017/sports
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # [W1-02] §7-2 실측 오버레이 값을 코드로 승격 — mem_limit(아래) 1.8g와 짝을 이룬다.
      # 미지정 시에도 768m으로 기동(컨테이너 무제한 25%-추정 힙으로 되돌아가지 않는다).
      JAVA_OPTS: ${JAVA_OPTS:--Xmx768m}
      # ---- 1단계에서 새로 필요해지는 env 선배선 (W1-02 ⑤) ----
      # 기본값 있는 통과 배선 — 소비 티켓이 값을 채우기 전까지는 무해하다.
      # (과거 VIRTUAL_QUEUE_TOKEN_SECRET 미배선으로 dev/prod 부팅이 막힌 사고 재발 방지)
      APP_JWT_ALGORITHM: ${APP_JWT_ALGORITHM:-HS256}   # 소비: W1-05
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:-}    # 소비: W1-05
      APP_JWT_PUBLIC_KEY: ${APP_JWT_PUBLIC_KEY:-}      # 소비: W1-05
      PLATFORM_INTERNAL_BASE_URL: ${PLATFORM_INTERNAL_BASE_URL:-http://backend:8080}   # 소비: W1-06b
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-sports-application}          # 소비: W1-09
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sports-application}                      # 소비: W1-09
    # [W1-02] §7-2 실측 오버레이 값을 코드로 승격 — JVM -Xmx768m(위) + 컨테이너 실사용 오버헤드(~950m).
    # 런타임 컨테이너 증감 0 (base 12 → 12, §8-3 완료 판정 ⑧의 실제 요구는 "런타임 무변경"이다.
    # "13"은 compose 서비스 정의 수가 아니라 §8-3의 실행 컨테이너 실측치(12~14개) 기준 숫자) —
    # 1단계 런타임은 단일 backend 뿐이라 여기에만 적용한다.
    # [W1-02] docker-compose.lb.yml 오버레이가 backend를 replicas:3으로 확장하면 cpus 상한은
    # replica마다 적용된다 (합산 아님). §7-5 실측 모놀리스 3 replica 피크는 각 254~271% —
    # 이 250%(2.5 cpus) 상한은 그 실측 피크보다 낮으므로, lb 오버레이 적용 시
    # 상시 트래픽 시뮬레이터의 기존 베이스라인에 영향을 줄 수 있다.
    mem_limit: 1.8g
    cpus: 2.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- 데이터스토어 (단일 소유자 — ⑤ observability는 재정의하지 않고 참조만 한다) ----
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sports
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      # [W1-02] §7-6 — max_connections 500 (기본 151은 목표 구성 10인스턴스×풀40=400에 못 미침).
      # 풀 크기 배분 자체는 W1-03 소유, 여기서는 서버측 상한만 연다.
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 서비스명 반드시 mongodb (mongo 아님 — ⑤ exporter 접속 기준, SSOT)
  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    # maxmemory-policy=noeviction 근거: 이 Redis가 보유한 키(seat:lock:*, goods:limited-drop:*:remaining 등)는
    #   look-aside 캐시가 아니라 게이트 권위 데이터다. eviction되면 remaining 카운터가 사라져 오버셀로 직결되므로
    #   evict 대신 OOM 에러로 실패를 명시적으로 드러낸다(private-redis-convention "서버 설정"). 순수 캐시 키가
    #   이후 추가되면 같은 인스턴스에 volatile-lru로 섞지 말고 별도 인스턴스/논리 DB로 분리 검토(연관 노트).
    # maxmemory=256mb 근거: 로컬 dev 규모 기준 상한. prod 사이징은 이 작업 범위 밖 — prod override에서 별도 결정 필요.
    # persistence(AOF/RDB) 비활성 근거: remaining 카운터는 DB stock 기준으로 seedIfAbsent(SET NX)로 재시드 가능해
    #   Redis 재기동으로 유실돼도 판매자가 회차를 다시 열면 복구된다. AOF 필수 아님(private-redis-convention 서버 설정).
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # KRaft 단일 브로커 (ZooKeeper 없음)
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---- 기존 mock (유지 — 제거 0). 호스트 포트는 dev/prod override(INFRA-05/06) 소유로 이관 ----
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/sports-app;
      "

  mock-pg:
    build:
      context: ./mock-pg
      dockerfile: Dockerfile
    environment:
      PORT: 9090
      BE_WEBHOOK_URL: ${BE_WEBHOOK_URL:-http://host.docker.internal:8080/payments/webhook}
    restart: unless-stopped

  # ---- 외부 Open API mock (유료/키필요 서비스 로컬 대체) ----
  mock-kakao-local:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./mock-servers/kakao-local:/app
    command: sh -c "npm install --no-audit --no-fund && node server.js"

  mock-data-go-kr:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./mock-servers/data-go-kr:/app
    command: sh -c "npm install --no-audit --no-fund && node server.js"

  mock-solapi:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./mock-servers/solapi:/app
    command: sh -c "npm install --no-audit --no-fund && node server.js"

  # 이메일 catcher (SMTP 1025, Web UI 8025)
  mailhog:
    image: mailhog/mailhog:latest

volumes:
  minio-data:
  mysql-data:
  mongodb-data:
  redis-data:
  kafka-data:
