mcp:
  external-url: http://localhost:8080

spring:
  ai:
    mcp:
      server:
        enabled: true
        name: sports-mcp-server-test
        version: 1.0.0
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
  main:
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sports-app-test
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.sportsapp.*"
    producer:
      acks: all
    listener:
      auto-startup: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sports}
      auto-index-creation: true
      repositories:
        type: auto
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sports?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # [FIX-03][code-review 후속] connection-timeout(5s)만 src/main/resources/application.yml 과
      # 정합화한다 — 운영값 maximum-pool-size=30 은 main 전용이며 여기에 그대로 반영하지 않는다.
      # 최초에 main과 동일하게 30을 반영했다가 실측으로 붕괴를 확인해 되돌린 값이다:
      # HikariCP는 minimum-idle 미지정 시 minimum-idle=maximum-pool-size 로 동작해, 컨텍스트
      # 기동 즉시 maximum-pool-size 만큼 idle 커넥션을 채운다. 이 테스트 스위트는
      # @TestPropertySource 조합이 다른 여러 클래스가 각자 별도 Spring 컨텍스트로 캐시되는데,
      # 30을 반영한 상태에서 캐시된 컨텍스트가 6개만 있어도 30*6=180 > Testcontainers MySQL의
      # 기본 max_connections(151)을 넘어 "Too many connections"(1040)로 컨텍스트 기동 자체가
      # 실패하며 전체 스위트가 붕괴했다(실측: UnsatisfiedDependencyException flywayInitializer,
      # Too many connections 154건). 대부분의 테스트는 MockMvc 단일 스레드 호출이라 동시 커넥션
      # 요구가 낮으므로 공용 기본값은 작게 유지하고(minimum-idle 도 명시해 즉시 최대치를 채우지
      # 않게 한다), 풀 크기 자체가 시나리오의 본질인 테스트(LimitedDropConnectionPoolExhaustionScenarioTest·
      # LimitedDropPurchaseConcurrencyScenarioTest)는 @TestPropertySource 로 개별 오버라이드한다.
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        # BE-12: 방목록 미리보기 findMyRoomViews 의 N+1 회피를 prepareStatementCount 델타로
        # 검증하기 위해 테스트 프로파일에서만 통계 수집을 켠다.
        generate_statistics: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      # BE-11: src/test/resources/application.yml 은 클래스패스 application.yml 을 완전히 대체한다
      # (src/main 값이 테스트에 병합되지 않음, 실측 확인) — main과 동일하게 idempotent 초기화 사용.
      initialize-schema: never
    job:
      # BE-11: 테스트에서도 부팅 시 자동 실행 금지. 값이 없으면(matchIfMissing=true)
      # JobLauncherApplicationRunner 가 빈 파라미터로 전체 Job을 자동 실행해 테스트를 오염시킨다
      # (실측 확인 — Job: [...] launched with the following parameters: [{}]).
      enabled: false
  mail:
    host: localhost
    port: 1025

partner:
  auth:
    # 테스트 기본값은 true — Partner 관련 통합/시나리오 테스트가 별도 오버라이드 없이
    # 필터 동작을 검증할 수 있게 한다. 비활성 시나리오는 @TestPropertySource로 개별 오버라이드.
    enabled: true

chat:
  realtime:
    # 테스트 기본값은 true — BE-04 STOMP 통합 테스트가 별도 오버라이드 없이 동작하게 한다.
    # 비활성 시나리오(ChatRealtimeDisabledTest)는 @TestPropertySource로 개별 오버라이드.
    enabled: true

facility:
  program:
    # 테스트 기본값은 true — BE-59 program 통합/시나리오 테스트가 별도 오버라이드 없이 동작하게 한다.
    # 비활성 시나리오(ProgramApiControllerFeatureFlagDisabledTest)는 @TestPropertySource로 개별 오버라이드.
    enabled: true

storage:
  image:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    bucket: sports-app
    upload-expiry-seconds: 900
    download-expiry-seconds: 3600
    max-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

notification:
  templates:
    payment-completed:
      title: "결제 완료"
      body: "{amount}원 결제가 완료되었습니다."
    welcome:
      title: "가입 완료"
      body: "{userName}님, 스포츠 앱에 오신 것을 환영합니다."

limited-drop:
  enabled: true
  redis-gate:
    enabled: true

# BE-03: HmacEntryTokenGateway 는 빈 secret 시 부팅 실패(init 블록 require)하므로, 이 파일이
# src/main/resources/application.yml 을 완전히 대체하는 테스트 컨텍스트에서도 항상 유효한
# secret 을 갖도록 명시한다 (app.jwt.secret 과 동일 패턴 — 운영 기본값이 아닌 테스트 전용 값).
virtual-queue:
  token:
    secret: test-virtual-queue-token-secret-for-integration-tests
    ttl-seconds: 300

app:
  jwt:
    secret: test-secret-key-for-integration-tests-that-is-at-least-32-chars-long
  limited-drop:
    reservation:
      semaphore-permits: 200
      acquire-timeout-millis: 200
      marker-ttl-seconds: 600

management:
  health:
    defaults:
      enabled: false
    mongo:
      enabled: false
    redis:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.data.repository.config: DEBUG
    org.springframework.cache: TRACE
