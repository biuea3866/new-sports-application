# [W1-03] commerce 서비스 커넥션 예산 — 실행설계 §7-6
#
# 풀 40/인스턴스 × 2 replica = 80. 6개 서비스 중 가장 큰 배분이다 — goods·ticketing 두 컨텍스트를
# 담고 주문·재고 쓰기 경로가 몰려 있다(§4-1 C8 실측 기준 최대 결합·최대 파일 수 컨텍스트).
#
# 1단계에서는 이 프로파일이 활성화되지 않는다(단일 bootstrap 앱만 기동). 2단계 서비스 물리 추출
# 시점에 활성화될 설정을 미리 확정해 두는 것이 이 파일의 목적이다.
# connection-timeout 5000ms 는 FIX-03 확정값 — nginx read/send timeout(15s, infra/nginx/lb.conf)
# 보다 먼저 실패 응답을 내보내야 "응답 전달 경로 절단"(F3)이 재발하지 않는다.
#
# [W1-09] 분산 추적 서비스 식별 — spring.application.name 이 곧 span 의 service.name 리소스 속성이다.
# 이름이 하나로 뭉치면 경계 간 호출(C1~C10)을 트레이스에서 구분할 수 없다 (실행설계 §6-1).
# `${OTEL_SERVICE_NAME:...}` 형태라 **env 가 yml 을 이긴다** — compose 배선(W1-02)과 이름이 어긋나지
# 않게 하려는 의도다. 그래서 2단계 compose 는 OTEL_SERVICE_NAME 을 **서비스별로** 설정해야 한다
# (전역 1값으로 두면 6서비스가 한 이름으로 뭉쳐 이 티켓의 목적이 무력화된다).
spring:
  application:
    name: ${OTEL_SERVICE_NAME:sports-commerce}
  datasource:
    hikari:
      maximum-pool-size: 40
      connection-timeout: 5000
