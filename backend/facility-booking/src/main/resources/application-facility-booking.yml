# [W1-03] facility-booking 서비스 커넥션 예산 — 실행설계 §7-6
#
# 풀 30/인스턴스 × 2 replica = 60. facility·booking 병합 컨텍스트로 슬롯 조회·예약 쓰기가
# 함께 들어온다. commerce 다음으로 크지만 주문 경로가 없어 40까지는 필요하지 않다.
#
# 1단계에서는 이 프로파일이 활성화되지 않는다(단일 bootstrap 앱만 기동). 2단계 서비스 물리 추출
# 시점에 활성화될 설정을 미리 확정해 두는 것이 이 파일의 목적이다.
# connection-timeout 5000ms 는 FIX-03 확정값 — 전 서비스 통일.
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      connection-timeout: 5000
